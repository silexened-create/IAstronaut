<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>IAstronaut - Misión Sistema Solar</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Outfit:wght@300;400;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="shared.css">
    <link rel="stylesheet" href="doc_estilo.css">
    <style>
        #loading-screen {
            position: fixed; 
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(5, 8, 20, 0.95);
            display: flex; flex-direction: column; 
            justify-content: center; align-items: center;
            color: #00ffff; z-index: 9999;
            transition: opacity 0.5s ease;
        }
        #loading-screen.hidden { pointer-events: none; opacity: 0; }
        .spinner {
            width: 60px; height: 60px; 
            border: 4px solid rgba(0, 255, 255, 0.1); border-top: 4px solid #00ffff; 
            border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 25px;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.4);
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        #loading-text { font-size: 22px; font-family: 'Orbitron', sans-serif; letter-spacing: 3px; text-shadow: 0 0 10px rgba(0, 255, 255, 0.5); }
    </style>
</head>

<body>

    <button id="hamburger-menu" class="hamburger-btn">
        <span>☰</span>
    </button>

    <div id="loading-screen" class="hidden">
        <div class="spinner"></div>
        <div id="loading-text">Iniciando módulos...</div>
    </div>

    <div class="dashboard">
        <div class="indice-navegacion glass-panel">
            <a href="index.html" class="home-link">
                🏠 CONTROL CENTRAL
            </a>
            <div id="menu-planetas">
                <h3>📍 BITÁCORA DE MISIÓN</h3>
                <!-- Contenido dinámico desde JS -->
            </div>
        </div>

        <div class="monitor glass-panel">
            <h2 id="titulo-capitulo" class="pulse">SINCRONIZANDO DATOS...</h2>
            <img id="planeta-gif" src="Image/solar_system.gif" alt="Planeta">
            <div class="lectura-espacial" id="contenedor-texto"></div>
        </div>

        <div class="monitor-comunicaciones glass-panel">
            <h3>📻 RADIO DE MISIÓN</h3>
            <div id="chat-ia" class="chat-display">
                <p>> Bienvenido, Cadete. Enlace de comunicación establecido.</p>
                <p>> Seleccione un destino para iniciar la telemetría visual.</p>
            </div>
            <div class="input-grupo">
                <input type="text" id="pregunta-input" placeholder="TRANSMITIR A CONTROL..."
                    onkeypress="if(event.key === 'Enter') procesarPregunta()">
                <button onclick="procesarPregunta()">ENVIAR</button>
            </div>
        </div>
    </div>

    <div class="controles">
        <audio id="audio-doc" controls></audio>
    </div>

    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
      }
    </script>
    <script type="module" src="js/documental.js"></script>
</body>


</html>
